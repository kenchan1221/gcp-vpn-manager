name: Test and build Windows
on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.architecture }}
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - name: Test, build and verify native architecture
        shell: pwsh
        run: .\scripts\build.ps1 -Architecture "${{ matrix.architecture }}"
      - name: Save dependency inventory
        shell: pwsh
        run: python -m pip freeze | Out-File "releases\windows-${{ matrix.architecture }}\dependencies.txt" -Encoding utf8
      - name: Hash artifact
        shell: pwsh
        run: |
          $folder = "releases\windows-${{ matrix.architecture }}"
          $file = Get-Item "$folder\*.exe"
          "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower())  $($file.Name)" |
            Out-File "$folder\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: releases/windows-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 14
  server-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n server/setup-server.sh server/add-peer.sh
      - run: shellcheck -S warning server/setup-server.sh server/add-peer.sh
